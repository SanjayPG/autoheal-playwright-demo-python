[pytest]
# Pytest configuration for AutoHeal Playwright demo

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Asyncio mode
asyncio_mode = auto

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    --durations=10

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    healing: marks tests that demonstrate AutoHeal healing
    login: login-related tests
    forms: form interaction tests
    dynamic: dynamic content tests
    saucedemo: tests for saucedemo.com website
    cart: shopping cart related tests
    example: AutoHeal example/demo tests
    pom: Page Object Model tests

# Coverage options (when using --cov)
[coverage:run]
source = tests,pages,config
omit = */tests/*,*/__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
